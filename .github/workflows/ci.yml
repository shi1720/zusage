name: Application checks

on:
  push:
    branches: [aperture-redesign]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track_2a
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: track_2a/src/frontend/package-lock.json
      - name: Backend lint and regression tests
        run: |
          uv sync --project src/backend --extra dev
          uv run --project src/backend ruff check src/backend/zusage
          uv run --project src/backend pytest src/backend/tests
        env:
          ZUSAGE_OFFLINE: 'true'
      - name: Frontend tests and production build
        working-directory: track_2a/src/frontend
        run: |
          npm ci
          npm test
          npm run build

  docker-clean-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify submission layout and data limit
        run: python3 track_2a/scripts/check_template.py
      - name: Build and launch from repository root
        run: make run NAME=zusage-ci IMAGE=zusage:ci
      - name: Check exported template variables reach Docker
        run: |
          export LLM_NAME=swiss-ai/Apertus-v1.5-8B
          export LLM_BASE_URL=
          export LLM_API_KEY=synthetic-ci-env-check
          make run NAME=zusage-ci IMAGE=zusage:ci
          docker exec zusage-ci python -c "import os; assert os.environ['LLM_API_KEY'] == 'synthetic-ci-env-check'"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs zusage-ci || true
          docker rm -f zusage-ci || true
          docker volume rm zusage-ci-data || true
