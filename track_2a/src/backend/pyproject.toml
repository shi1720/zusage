[project]
name = "zusage"
version = "1.0.0"
description = "Zusage  -  the Apertus-powered interview coach for Swiss apprenticeship seekers."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Shivam Gupta" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "langgraph>=0.2.60",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=43",
    "pywebpush>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
zusage = "zusage.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zusage*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# prompts and hand-written multilingual phrase tables read better unwrapped
"zusage/engine/prompts.py" = ["E501"]
"zusage/engine/phrases.py" = ["E501"]
"zusage/engine/brain.py" = ["E501"]
"zusage/eval/harness.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
