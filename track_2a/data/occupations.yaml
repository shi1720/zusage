  - id: hauswirtschaft_eba
    level: EBA
    field: hospitality
    icon: sparkles
    name:
      de: "Hauswirtschaftspraktikerin / Hauswirtschaftspraktiker EBA"
      fr: "Employée / Employé en intendance AFP"
      it: "Addetta / Addetto d'economia domestica CFP"
      en: "Household Services Assistant (EBA)"
    competencies: [carefulness, reliability, friendliness, hygiene, teamwork, independence]
    company:
      name: "Alterszentrum Rosengarten"
      town: "Genève"
      facts:
        - "Care home with 80 residents and 110 employees."
        - "Apprentices work in laundry, cleaning, kitchen support and the cafeteria."
        - "Respectful contact with elderly residents is a big part of the job."
        - "Possible to continue with the 3-year Fachfrau Hauswirtschaft EFZ."
    questions:
      - id: hw_resident
        phase: situational
        difficulty: 2
        targets: [communication, self_awareness]
        probe: "Ask how they would show respect while still doing their work."
        text:
          de: "Eine Bewohnerin möchte mit Ihnen plaudern, aber Sie haben noch viel Arbeit. Wie reagieren Sie?"
          fr: "Une résidente aimerait discuter avec vous, mais vous avez encore beaucoup de travail. Comment réagissez-vous ?"
          it: "Una residente vorrebbe chiacchierare con lei, ma lei ha ancora molto lavoro. Come reagisce?"
          en: "A resident would like to chat with you, but you still have a lot of work. How do you react?"
          gsw: "E Bewohnerin möcht mit Ihne plaudere, aber Sie händ no vill Arbet. Wie reagiered Sie?"
      - id: hw_order
        phase: motivation
        difficulty: 1
        targets: [motivation, examples]
        probe: "Ask what they already help with at home."
        text:
          de: "Was gefällt Ihnen an Arbeiten wie Kochen, Waschen oder Ordnung machen?"
          fr: "Qu'est-ce qui vous plaît dans des tâches comme cuisiner, laver ou ranger ?"
          it: "Cosa le piace di lavori come cucinare, lavare o mettere in ordine?"
          en: "What do you like about tasks like cooking, washing or tidying up?"
          gsw: "Was gfallt Ihne a Arbete wie Choche, Wäsche oder Ornig mache?"
