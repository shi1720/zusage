        difficulty: 2
        targets: [motivation, examples]
        probe: "Ask what fascinates them about how machines work."
        text:
          de: "Was interessiert Sie an Technik und Maschinen?"
          fr: "Qu'est-ce qui vous intéresse dans la technique et les machines ?"
          it: "Cosa la interessa della tecnica e delle macchine?"
          en: "What interests you about technology and machines?"
          gsw: "Was interessiert Sie a Technik und Maschine?"

