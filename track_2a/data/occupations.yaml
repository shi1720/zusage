# Probelauf occupation catalogue (Swiss VET / Berufsbildung)
# ---------------------------------------------------------------------------
# 12 of the most chosen Swiss apprenticeships (EFZ = 3-4 yr Federal VET
# Diploma / CFC / AFC; EBA = 2 yr Federal VET Certificate / AFP / CFP).
# Official occupation titles in DE / FR / IT follow berufsberatung.ch /
# orientation.ch / orientamento.ch.
#
# Each occupation carries:
#   - competencies: what Swiss training companies look for (used to tailor
#                   feedback and to judge relevance)
#   - company:      a FICTIONAL training company (all names invented) with a closed fact base.
#                   When the candidate asks questions, the interviewer may
#                   answer ONLY from these facts (anti-hallucination design).
#   - questions:    occupation-specific questions, merged by the planner.
#
# Teachers / career counsellors can add occupations by appending to this file
# or by pasting a real job ad in the UI (free-text "job posting" field).
version: "1.2"

occupations:
  - id: kaufmann_efz
    level: EFZ
    field: business
    icon: briefcase
    name:
      de: "Kauffrau / Kaufmann EFZ"
      fr: "Employée / Employé de commerce CFC"
      it: "Impiegata / Impiegato di commercio AFC"
      en: "Commercial Employee (EFZ)"
    competencies: [organisation, reliability, customer orientation, written communication, MS Office, languages]
    company:
      name: "Rhätia Treuhand AG"
      town: "Chur"
      facts:
        - "Fiduciary and accounting firm with 38 employees in Chur."
        - "We train 4 commercial apprentices; they rotate through accounting, payroll, reception and HR."
        - "Vocational school is 1.5 days per week at the KV Chur (kaufmännische Berufsschule)."
        - "Apprentices can do the Berufsmaturität (BM1) during the apprenticeship if school grades allow."
        - "Working hours 07:45-17:00 with flexible lunch; apprentices get a half-fare travelcard (Halbtax)."
    questions:
      - id: kv_tasks
        phase: motivation
        difficulty: 2
        targets: [relevance, motivation]
        probe: "Ask which of these tasks they would enjoy most and why."
        text:
          de: "Was glauben Sie, macht eine kaufmännische Lernende bei uns den ganzen Tag?"
          fr: "À votre avis, que fait un·e apprenti·e employé·e de commerce chez nous toute la journée ?"
          it: "Secondo lei, cosa fa tutto il giorno un'apprendista impiegata di commercio da noi?"
          en: "What do you think a commercial apprentice does all day at our company?"
          gsw: "Was glaubed Sie, was macht e KV-Lernendi bi üs de ganz Tag?"
      - id: kv_angry_customer
        phase: situational
        difficulty: 3
        targets: [communication, examples, relevance]
        probe: "Ask what exactly they would say to the customer."
        text:
          de: "Ein Kunde ruft verärgert an, weil seine Rechnung falsch ist, und Ihre Chefin ist nicht da. Was machen Sie?"
          fr: "Un client appelle, fâché, parce que sa facture est fausse, et votre cheffe est absente. Que faites-vous ?"
          it: "Un cliente chiama arrabbiato perché la sua fattura è sbagliata e la sua responsabile non c'è. Cosa fa?"
          en: "An angry customer calls because their invoice is wrong, and your boss is out. What do you do?"
          gsw: "En Chund lüütet verärgeret aa, will sini Rächnig falsch isch, und Ihri Chefin isch nöd da. Was mached Sie?"

  - id: fage_efz
    level: EFZ
    field: health
    icon: heart-pulse
    name:
      de: "Fachfrau / Fachmann Gesundheit EFZ"
      fr: "Assistante / Assistant en soins et santé communautaire CFC"
      it: "Operatrice / Operatore sociosanitario AFC"
      en: "Healthcare Assistant (EFZ)"
    competencies: [empathy, resilience, hygiene, teamwork, reliability, discretion]
    company:
      name: "Spital Limmattal-Ost"
      town: "Zürich"
      facts:
        - "Regional hospital with 420 employees; 18 healthcare apprentices (FaGe) per year."
        - "Apprentices rotate between surgery, internal medicine and the care home ward."
        - "Shift work starts in the 2nd year; no night shifts for apprentices under 18."
        - "A dedicated vocational trainer (Berufsbildnerin) supports apprentices every week."
        - "Vocational school 1-2 days per week; BM2 after the apprenticeship is supported."
    questions:
      - id: fage_why_care
        phase: motivation
        difficulty: 2
        targets: [motivation, examples]
        probe: "Ask whether they have cared for someone before (grandparents, siblings, Schnupperlehre)."
        text:
          de: "In der Pflege arbeitet man nahe mit Menschen, auch wenn es ihnen schlecht geht. Was zieht Sie an diesem Beruf an?"
          fr: "Dans les soins, on travaille au plus près des gens, même quand ils vont mal. Qu'est-ce qui vous attire dans ce métier ?"
          it: "Nelle cure si lavora a stretto contatto con le persone, anche quando stanno male. Cosa la attira di questa professione?"
          en: "In care you work closely with people, even when they are unwell. What attracts you to this job?"
          gsw: "I de Pfleg schaffet mer nöch mit Mänsche, au wenn's ene schlächt gaht. Was gfallt Ihne a dem Bruef?"
      - id: fage_refuses
        phase: situational
        difficulty: 3
        targets: [communication, self_awareness, relevance]
        probe: "Ask how they would stay calm and whom they would inform."
        text:
          de: "Eine ältere Patientin will ihre Medikamente nicht nehmen und wird laut. Wie reagieren Sie?"
          fr: "Une patiente âgée refuse de prendre ses médicaments et commence à crier. Comment réagissez-vous ?"
          it: "Una paziente anziana non vuole prendere i farmaci e alza la voce. Come reagisce?"
          en: "An elderly patient refuses her medication and starts shouting. How do you react?"
          gsw: "En älteri Patientin wott ihri Medikament nöd näh und wird luut. Wie reagiered Sie?"

  - id: detailhandel_efz
    level: EFZ
    field: retail
    icon: shopping-bag
    name:
      de: "Detailhandelsfachfrau / Detailhandelsfachmann EFZ"
      fr: "Gestionnaire du commerce de détail CFC"
      it: "Impiegata / Impiegato del commercio al dettaglio AFC"
      en: "Retail Specialist (EFZ)"
    competencies: [customer service, friendliness, product interest, resilience, teamwork, punctuality]
    company:
      name: "Velo & Sport Aare GmbH"
      town: "Bern"
      facts:
        - "Bike and outdoor sports shop with 22 employees and its own repair workshop."
        - "Apprentices learn sales, product advice, cash desk and stock management."
        - "Focus 'Beraten' (customer advice) - apprentices run their own product corner in year 3."
