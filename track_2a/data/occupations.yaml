    questions:
      - id: dh_sell
        phase: situational
        difficulty: 2
        targets: [communication, relevance, examples]
        probe: "Ask which questions they would ask the customer first."
        text:
          de: "Eine Kundin weiss nicht, welches Velo sie kaufen soll. Wie beraten Sie sie?"
          fr: "Une cliente ne sait pas quel vélo acheter. Comment la conseillez-vous ?"
          it: "Una cliente non sa quale bicicletta comprare. Come la consiglia?"
          en: "A customer doesn't know which bike to buy. How do you advise her?"
          gsw: "E Chundin weiss nöd, weles Velo sie söll chaufe. Wie berated Sie sie?"
      - id: dh_saturday
        phase: motivation
        difficulty: 2
        targets: [motivation, self_awareness]
        probe: "Ask how they would organise their free time and hobbies around it."
        text:
          de: "Im Detailhandel arbeitet man auch am Samstag. Wie stehen Sie dazu?"
          fr: "Dans le commerce de détail, on travaille aussi le samedi. Qu'en pensez-vous ?"
          it: "Nel commercio al dettaglio si lavora anche il sabato. Cosa ne pensa?"
          en: "In retail you also work on Saturdays. How do you feel about that?"
          gsw: "Im Detailhandel schaffet mer au am Samschtig. Wie gsehnd Sie das?"

  - id: informatik_efz
    level: EFZ
    field: ict
    icon: laptop
    name:
      de: "Informatikerin / Informatiker EFZ"
      fr: "Informaticienne / Informaticien CFC"
      it: "Informatica / Informatico AFC"
      en: "IT Specialist (EFZ)"
    competencies: [logical thinking, curiosity, persistence, teamwork, English, explaining tech simply]
    company:
      name: "Alpina Software AG"
      town: "St. Gallen"
      facts:
        - "Software company with 120 employees building apps for Swiss public transport."
        - "Apprentices specialise in application development (Applikationsentwicklung)."
        - "First year in our own apprentice lab, then real projects in agile teams."
        - "Each apprentice gets a laptop and a mentor; hybrid work possible from year 2."
        - "We support BM1 and later studies at a university of applied sciences (FH)."
    questions:
      - id: it_project
        phase: motivation
        difficulty: 2
        targets: [examples, motivation, clarity]
        probe: "Ask what was the hardest problem and how they solved it."
        text:
          de: "Haben Sie schon einmal selbst etwas programmiert oder gebastelt, zum Beispiel ein Spiel oder eine Website? Erzählen Sie!"
          fr: "Avez-vous déjà programmé ou bricolé quelque chose vous-même, par exemple un jeu ou un site web ? Racontez-moi !"
          it: "Ha già programmato o creato qualcosa da solo/a, per esempio un gioco o un sito web? Mi racconti!"
          en: "Have you ever programmed or built something yourself, like a game or a website? Tell me about it!"
          gsw: "Händ Sie scho mal sälber öppis programmiert oder baschtlet, zum Bispiel es Spiel oder e Websiite? Verzelled Sie!"
      - id: it_explain
        phase: situational
        difficulty: 3
        targets: [communication, clarity]
        probe: "Ask them to try a simple analogy."
        text:
          de: "Ihre Grossmutter fragt Sie, was 'die Cloud' ist. Wie erklären Sie es ihr?"
          fr: "Votre grand-mère vous demande ce qu'est « le cloud ». Comment le lui expliquez-vous ?"
          it: "Sua nonna le chiede che cos'è «il cloud». Come glielo spiega?"
          en: "Your grandmother asks you what 'the cloud' is. How do you explain it to her?"
          gsw: "Ihri Grossmuetter fragt Sie, was 'd'Cloud' isch. Wie erkläred Sie ihre das?"

