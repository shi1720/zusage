          it: "Cosa le piace del lavoro manuale? Ha già riparato qualcosa?"
          en: "What do you like about working with your hands? Have you ever repaired something?"
          gsw: "Was gfallt Ihne dra, mit de Händ z'schaffe? Händ Sie scho mal öppis flickt?"

