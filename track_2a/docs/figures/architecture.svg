<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Atkinson Hyperlegible, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5d6b"/></marker>
    <style>
      .box{fill:#fff;stroke:#d3dce3;stroke-width:1.5}
      .det{fill:#f3f6f8;stroke:#7d8f9c;stroke-width:1.5;stroke-dasharray:5 4}
      .llm{fill:#16232e}
      .t{font-size:17px;font-weight:700;fill:#16232e}
      .s{font-size:13.5px;fill:#4b5d6b}
      .w{font-size:17px;font-weight:700;fill:#fff}
      .ws{font-size:13.5px;fill:#c9d3da}
      .lab{font-size:12.5px;fill:#4b5d6b}
      .ey{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#7d8f9c}
      .ln{stroke:#4b5d6b;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#eef2f5"/>
  <!-- browsers -->
  <text x="30" y="40" class="ey">BROWSER</text>
  <rect x="30" y="54" width="230" height="96" rx="14" class="box"/>
  <text x="48" y="84" class="t">Student app</text>
  <text x="48" y="106" class="s">interview room · Gipfelbuch</text>
  <text x="48" y="126" class="s">tracker · drills · progress</text>
  <rect x="30" y="170" width="230" height="76" rx="14" class="box"/>
  <text x="48" y="200" class="t">Teacher cockpit</text>
  <text x="48" y="222" class="s">heatmap · weak spots · consent</text>
  <rect x="30" y="266" width="230" height="58" rx="14" class="box"/>
  <text x="48" y="292" class="t">Voice layer</text>
  <text x="48" y="312" class="s">on-device TTS · opt-in dictation</text>
  <!-- container -->
  <rect x="300" y="30" width="640" height="460" rx="22" fill="none" stroke="#16232e" stroke-width="2"/>
  <text x="320" y="56" class="ey">ZUSAGE CONTAINER · ON-PREMISE · FASTAPI</text>
  <rect x="320" y="70" width="190" height="70" rx="12" class="box"/>
  <text x="336" y="98" class="t">API &amp; auth</text>
  <text x="336" y="120" class="s">roles · cookie/Bearer</text>
  <!-- engine -->
  <rect x="530" y="70" width="390" height="300" rx="16" fill="#fffbea" stroke="#e0a800" stroke-width="1.5"/>
  <text x="548" y="94" class="ey" fill="#8a6d00">LANGGRAPH INTERVIEW ENGINE</text>
  <rect x="548" y="106" width="166" height="62" rx="10" class="det"/>
  <text x="560" y="132" class="t">Planner</text>
  <text x="560" y="152" class="s">FHGR flow · focus</text>
  <rect x="734" y="106" width="166" height="62" rx="10" class="det"/>
  <text x="746" y="132" class="t">Guard</text>
  <text x="746" y="152" class="s">distress · redaction</text>
  <rect x="548" y="186" width="352" height="70" rx="10" class="box" stroke="#16232e" stroke-width="2"/>
  <text x="562" y="214" class="t">Assess &amp; react — 1 call / answer</text>
  <text x="562" y="236" class="s">scores · quote · tip · model answer · follow-up · reaction</text>
  <rect x="548" y="274" width="352" height="70" rx="10" class="det"/>
  <text x="562" y="302" class="t">Validator</text>
  <text x="562" y="324" class="s">clamp · quote ∈ answer · language ID · fallbacks</text>
  <!-- learning + kb + db -->
  <rect x="320" y="160" width="190" height="70" rx="12" class="box"/>
  <text x="336" y="188" class="t">Learning layer</text>
  <text x="336" y="210" class="s">Leitner · calibration</text>
  <rect x="320" y="250" width="190" height="94" rx="12" class="box"/>
  <text x="336" y="278" class="t">Knowledge base</text>
  <text x="336" y="300" class="s">rubric · 12 occupations</text>
  <text x="336" y="320" class="s">questions × 5 languages</text>
  <rect x="320" y="390" width="600" height="80" rx="12" class="box"/>
  <text x="336" y="420" class="t">SQLite / Postgres</text>
  <text x="336" y="444" class="s">users · classes · profiles · applications · interviews (JSON state) · drills</text>
  <!-- llm -->
  <rect x="975" y="150" width="200" height="140" rx="18" class="llm"/>
  <text x="995" y="184" class="w">Apertus 1.5 8B</text>
  <text x="995" y="208" class="ws">OpenAI-compatible</text>
  <text x="995" y="230" class="ws">CSCS · vLLM · llama.cpp</text>
  <text x="995" y="252" class="ws">MLX · Ollama</text>
  <text x="995" y="274" class="ws">&lt; 32 GB VRAM (Q4: 6 GB)</text>
  <!-- arrows -->
  <path d="M260 102 H318" class="ln"/>
  <path d="M260 208 H290 V120 H318" class="ln"/>
  <path d="M510 105 H528" class="ln"/>
  <path d="M724 168 V184" class="ln"/>
  <path d="M724 256 V272" class="ln"/>
  <path d="M900 221 H973" class="ln"/>
  <text x="912" y="210" class="lab">JSON</text>
  <path d="M415 140 V158" class="ln"/>
  <path d="M510 297 H528" class="ln"/>
  <path d="M724 344 V388" class="ln"/>
</svg>
